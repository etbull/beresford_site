<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beresford Research</title>
<style>
  body{max-width:640px;margin:auto;padding:80px 24px 40px;min-height:calc(100vh - 120px);display:flex;flex-direction:column;background:#faf9f5;color:#242424;font:18px/1.6 Georgia,serif}
  header,.logo,#w{font-family:Helvetica,Arial,sans-serif}
  .logo{margin-bottom:24px;font-size:48px;font-weight:900;line-height:1}
  h1{display:inline-block;margin:24px 0;font-size:clamp(28px,9vw,46px);font-weight:600;letter-spacing:.13em;line-height:1.2}
  h1 span{display:block;font-size:.48em;letter-spacing:1.08em;margin-right:-1.08em}
  header,footer{text-align:center}
  a{color:inherit;font-size:16px;text-underline-offset:4px}
  #w{margin:auto 0;padding:42px 0 60px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;cursor:grab;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);text-transform:uppercase;letter-spacing:.13em}
</style>
<header>
  <h1>BERESFORD<span>RESEARCH</span></h1>
</header>
<main>
  <p>Beresford Research is an independent technology research and development company. We explore ideas in computing, mathematics and artificial intelligence, and build software where those ideas have practical applications.</p>
</main>
<div id="w"></div>
<script>w.innerHTML='Coming Soon&nbsp;·&nbsp;'.repeat(12);w.onscroll=()=>{h=w.scrollWidth/2;w.scrollLeft=(w.scrollLeft-1+h)%h+1};w.scrollLeft=1;v=1,f=0;setInterval(()=>{v+=(!w.matches(":hover")-v)/25;f+=v;w.scrollLeft+=f|0;w.onscroll();f%=1},40)</script>
<footer><div class="logo" aria-hidden="true">∴</div><a href="mailto:contact@bsfrd.com">contact@bsfrd.com</a></footer>
</html>
